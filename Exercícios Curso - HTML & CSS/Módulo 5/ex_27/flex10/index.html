<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Flexible Box Module</title>
    <style>
        div.container{
            background-color: lightsalmon;
            display: flex;
            flex-flow:row nowrap;
            
            
        }

        div.item{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
            flex-basis: 300px;
            flex-grow:1; 
            flex-shrink: 1;  
            
        }

        div#i2{
            flex-shrink: 2;
            flex-grow: 0;


        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item" id="i2">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
