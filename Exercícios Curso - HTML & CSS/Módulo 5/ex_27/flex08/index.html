<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Flexible Box Module</title>
    <style>
        div.container{
            width: 200px;
            height: 100px;
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            
        }

        div.item{
            background-color: lightblue;
            text-align: center;
            border: 1px solid black;
           
        }

        div#i1{
         

        }
        div#i2{
           

        }
        div#i3{
          align-self:  stretch;

        }
        div#i4{
         

        }
        div#i5{
          align-self:  center;

        }
        div#i6{
          align-self:  flex-end;

        }
        div#i7{
          align-self:  center;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
