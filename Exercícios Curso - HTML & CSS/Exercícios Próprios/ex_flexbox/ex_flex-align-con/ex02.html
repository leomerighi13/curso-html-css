<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;

        }

        body{
            background-color: rgb(0, 0, 0);

        }

        main{
            width: 90vw;
            height: 100vh;
            background-color: grey;
            margin: auto;
            display: flex;
            flex-flow: column wrap;
            justify-content: flex-end;
            justify-content: space-between;
            
            align-items: center;
            
        }

        section{
            width: 1159px;
            height: 150px;
            background-color: lightsalmon;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        section#i1{

            
        }

        section#i2{
            flex-basis: 100px;
            align-self: flex-start;
            

        }

        section#i3{
            width: 550px;
            height: 100px;
            align-self: flex-end;
            

        }

        section#i4{
           flex-basis: 300px;

        }
    </style>
</head>
<body>
     <main>
        <section id="i1"><h1>A</h1></section>
        <section id="i2"><h1>B</h1></section>
        <section id="i3"><h1>C</h1></section>
        <section id="i4"><h1>D</h1></section>
        
    </main>
</body>
</html>
