<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin:0px;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            width:100vw;
            background-color: black;
            display:flex;
            justify-content: center;
            align-items: center;

        }

        main{
            height:200px;
            width: 800px;
            background-color: antiquewhite;
            margin:auto;
            display: flex;
            flex-flow: row nowrap;


        }

        section{
            height: 200px;
            width: 250px;
            border: 1px solid black;
            background-color: blue;
            display:flex;
            justify-content: center;
            align-items: center;

        }

        section > h1{
            color: black;
            font-weight: bold;
            width: 100px;

        }

        section#sec1{
            flex-basis:100px;

        }

        section#sec2{
           flex-basis:auto;
        }

        section#sec3{
            flex-basis:auto;
        }


    </style>
</head>
<body>
    <main>
        <section id="sec1"><h1>aaaaaaa</h1></section>
        <section id="sec2"><h1>bb</h1></section>
        <section id="sec3"><h1>cccc</h1></section>
    </main>
</body>
</html>
