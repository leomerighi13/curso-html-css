<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form action="" method="get">
    
         <div>
             <label for="imod">Modelo de Celular</label>
             <select name="modelo" id="imod">
                <option value="">Escolha...</option>
                <optgroup label="Samsung">
                    <option value="cel1">cel1</option>
                    <option value="cel2">cel2</option>
                    <option value="cel3">cel3</option>
                </optgroup>
                <optgroup label="iPhone">
                    <option value="ip1">iphone1</option>
                    <option value="ip2">iphone2</option>
                    <option value="ip3">iphone3</option>
                </optgroup>
                <optgroup label="Android">
                    <option value="an1">android1</option>
                    <option value="an2">android2</option>
                    <option value="an3">android3</option>
                </optgroup>
             </select><br><br><br><br>
         </div>
            <div>
                <label for="icoment">Comentários</label><br>
                <textarea name="coment" id="icoment" cols="50" rows="10" placeholder="Comentários..." maxlength="150"></textarea>
            </div>


            <div>
                <label for="iprof">Lista de Profissões</label>
                <input type="text" name="prof" id="iprof" list="proflst">
                <datalist id="proflst">
                    <option value="Professor"></option>
                    <option value="Músico"></option>
                    <option value="Marceneiro"></option>
                    <option value="Engenheiro"></option>
                    <option value="Pescador"></option>
                </datalist>
            </div><br>

            <div>
                <label for="icor">Escolha uma cor</label>
                <input type="color" name="cor" id="icor" placeholder="#00ff00">
            </div><br>


         <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

         </div>
     



    </form>
</body>
</html>
