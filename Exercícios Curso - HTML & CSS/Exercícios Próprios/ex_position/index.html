<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Position de Card</title>
    <style>
            /* https://www.magnific.com/free-photos-vectors/new-ribbon */

            @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');



        *{
            padding: 0px;
            margin: 0px;
        }

        section{
            width: 400px;
            height: 400px;
            background-color: rgb(0, 0, 0);
            position:absolute;
            top:50%;
            left:50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            
        }

        section > h1{
            color: goldenrod;
            font-family: "Bebas Neue", sans-serif;
            font-weight: lighter;
            font-size:3em;
            text-shadow: 1px 1px 0px black;
            padding: 20px;


        }
        img{
            width: 300px;
            height: 300px;
            border: 3px solid goldenrod;
            border-radius: 10px;



        }

        div{
            width: 50px;
            height: 50px;
            
        }

        div > img{
            width: 120px;
            height: 120px;
            position: absolute;
            top: -5%;
            left:-4%;
            border:none;

        }



    </style>
</head>
<body>  
        <main> 
            <section>
                <h1>Álbum de Piano</h1>
                <img src="imagens/orquestra.jpeg" alt="imagem do pianista">
                <div>
                   <img src="imagens/fita.png" alt="fita de álbum novo">    
                </div>
            </section>
        </main>
</body>
</html>
